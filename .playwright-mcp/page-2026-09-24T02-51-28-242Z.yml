          - heading "Registrars" [level=1] [ref=f3e275]
          - paragraph [ref=f3e276]: The Registry-Registrar model is one of the universal practices in the field of domain names. It allows licensied Registrars to provide domain name registration services. licensied Registrars bundle domain registration services with various other add-on services (e.g. hosting, email, and other important services) and provide them to end-users (Registrants). This allows Registrants to manage everything related to domain names via a single platform, as well as receive continuous customer support.
