name: Platform CI

on:
  push:
    branches: [main, master]
    paths: ["platform/**"]
  pull_request:
    paths: ["platform/**"]

defaults:
  run:
    working-directory: platform

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع (typecheck)
        run: npm run typecheck

      - name: اختبارات الوحدة (vitest)
        run: npm test

      - name: بناء الإنتاج
        run: npm run build
        env:
          # مفاتيح وهمية — البناء لا يتصل بقاعدة بيانات
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # بوابة الأمان: RLS — تتطلب Supabase محلي (تُشغَّل قبل الدمج يدويًا أو بخادم ذاتي)
  # محليًا: npx supabase start && npm run test:rls
